<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f6b4f" />
    <title>BookMySeat is offline</title>
    <style>
      :root {
        color: #18251f;
        background: #f7f5ee;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 520px);
        border: 1px solid rgba(47, 107, 79, .18);
        border-radius: 24px;
        background: rgba(255, 255, 255, .76);
        box-shadow: 0 18px 60px rgba(24, 37, 31, .10);
        padding: 32px;
      }

      .mark {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: #2f6b4f;
        color: white;
        font-weight: 900;
        font-size: 24px;
      }

      h1 {
        margin: 24px 0 8px;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #5f6b63;
        line-height: 1.65;
      }

      button {
        margin-top: 24px;
        border: 0;
        border-radius: 14px;
        background: #2f6b4f;
        color: white;
        padding: 14px 18px;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">B</div>
      <h1>You are offline</h1>
      <p>BookMySeat is installed and ready, but this page needs a connection. Reconnect to refresh libraries, bookings, notifications, and dashboard updates.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
